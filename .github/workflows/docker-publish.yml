name: Build and publish Docker image

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    outputs:
      image: ${{ steps.publish.outputs.image }}
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=ref,event=tag

      - name: Build Docker image for verification
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test image before publication
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          image="${IMAGE_TAGS%%$'\n'*}"
          test -n "$image"
          bash .github/scripts/docker-smoke.sh "$image"

      - name: Publish verified image
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          image="${IMAGE_TAGS%%$'\n'*}"
          image_id=$(docker image inspect --format '{{.Id}}' "$image")
          while IFS= read -r tag; do
            test -n "$tag" || continue
            test "$(docker image inspect --format '{{.Id}}' "$tag")" = "$image_id"
            push_log=$(docker push "$tag")
            printf '%s\n' "$push_log"
            if [[ "$tag" == "$image" ]]; then
              digest=$(awk '/digest: sha256:/ { print $(NF-2) }' <<< "$push_log")
            fi
          done <<< "$IMAGE_TAGS"
          if [[ "$GITHUB_REF" == refs/heads/main ]]; then
            main_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
            if [[ "$main_sha" != "$GITHUB_SHA" ]]; then exit 0; fi
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            echo "image=${image%:*}@$digest" >> "$GITHUB_OUTPUT"
          fi

  promote-latest:
    needs: build-and-push
    if: needs.build-and-push.outputs.image != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    concurrency:
      group: ghcr-promote-latest
      cancel-in-progress: false
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote the verified main image
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ needs.build-and-push.outputs.image }}
        run: |
          main_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [[ "$main_sha" != "$GITHUB_SHA" ]]; then
            echo "Skipping latest: this run is no longer the tip of main."
            exit 0
          fi
          test -n "$IMAGE"
          docker buildx imagetools create --prefer-index=false --tag "${IMAGE%@*}:latest" "$IMAGE"
